name: "Feature Request"
description: "Suggest a new feature or enhancement for ObfuGuard"
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        ## Feature Request
        Describe the feature you'd like to see in ObfuGuard.

  - type: dropdown
    id: category
    attributes:
      label: "Category"
      description: "What type of feature is this?"
      options:
        - "New obfuscation technique"
        - "Improvement to existing technique"
        - "PE format support"
        - "CLI / UX improvement"
        - "Build / tooling"
        - "Testing / benchmarking"
        - "Documentation"
        - "Other"
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: "Suggested Priority"
      description: "How important is this feature to you?"
      options:
        - "Nice to have"
        - "Would improve my workflow"
        - "Important for my use case"
        - "Blocking my use case"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: "Problem Statement"
      description: "What problem does this feature solve? Is it related to a frustration?"
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "Proposed Solution"
      description: "Describe the solution you'd like."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives Considered"
      description: "Any alternative solutions or workarounds you've considered."
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: "Pre-submission Checklist"
      options:
        - label: "I have searched existing issues and feature requests for duplicates"
          required: true
        - label: "This feature aligns with ObfuGuard's purpose (PE binary obfuscation)"
          required: true
